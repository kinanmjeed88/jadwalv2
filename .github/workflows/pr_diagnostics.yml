name: PR Diagnostics

# ملف مؤقت لأغراض التشخيص أثناء تطوير الميزة: يشغّل التحليل والاختبارات ثم
# يبثّ خلاصتهما (أخطاء/تحذيرات التحليل + نتيجة الاختبارات) في هيئة annotations
# base64 صغيرة تُقرأ عبر GitHub API. يُحذف قبل الدمج النهائي.

on:
  pull_request:

jobs:
  report:
    name: Analyze and test report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter Sources
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze_full.log 2>&1
          ANALYZE_EXIT=$?
          set -e
          { grep -E "error •|warning •|^Analyzing|issues found|No issues found" analyze_full.log || true; } > analyze.log
          echo "analyze-exit-code: $ANALYZE_EXIT" >> analyze.log
          echo "analyze-error-lines: $(grep -c 'error •' analyze_full.log || true)" >> analyze.log
          echo "analyze-warning-lines: $(grep -c 'warning •' analyze_full.log || true)" >> analyze.log
          echo "analyze-info-lines: $(grep -c 'info •' analyze_full.log || true)" >> analyze.log
          cat analyze.log

      - name: Run Flutter Tests
        if: always()
        continue-on-error: true
        run: |
          FILES=$(find test -name '*_test.dart' ! -name 'backup_service_benchmark_test.dart' | tr '\n' ' ')
          set +e
          flutter test $FILES > tests_full.log 2>&1
          TESTS_EXIT=$?
          set -e
          { grep -E "::group::|tests passed|tests failed|Some tests failed|exit-code" tests_full.log || true; } > tests.log
          echo "tests-exit-code: $TESTS_EXIT" >> tests.log
          echo "tests-passed-lines: $(grep -c '::group::✅' tests_full.log || true)" >> tests.log
          echo "tests-failed-lines: $(grep -c '::group::❌' tests_full.log || true)" >> tests.log
          tail -5 tests.log

      - name: Publish analyze report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s analyze.log ] || exit 0
          base64 -w 0 analyze.log > analyze.b64
          rm -f apart* 2>/dev/null || true
          split -b 850 -d -a 2 analyze.b64 apart
          printf '::error::AMETA:chunks=%s bytes=%s\n' "$(ls apart* | wc -l)" "$(wc -c < analyze.log)"
          n=0
          for f in apart*; do
            n=$((n + 1))
            [ "$n" -le 10 ] || break
            printf '::error::ANALYZE-%s:%s\n' "${f##apart}" "$(cat "$f")"
          done

      - name: Publish analyze head again
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          n=0
          for f in apart*; do
            n=$((n + 1))
            [ "$n" -le 2 ] || break
            printf '::error::HEAD-%s:%s\n' "${f##apart}" "$(cat "$f")"
          done

      - name: Publish tests report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s tests.log ] || exit 0
          base64 -w 0 tests.log > tests.b64
          rm -f tpart* 2>/dev/null || true
          split -b 850 -d -a 2 tests.b64 tpart
          printf '::error::TMETA:chunks=%s bytes=%s\n' "$(ls tpart* | wc -l)" "$(wc -c < tests.log)"
          n=0
          for f in tpart*; do
            n=$((n + 1))
            [ "$n" -le 10 ] || break
            printf '::error::TESTS-%s:%s\n' "${f##tpart}" "$(cat "$f")"
          done
