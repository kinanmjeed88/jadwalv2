name: PR Diagnostics

# ملف مؤقت لأغراض التشخيص أثناء تطوير الميزة: يشغّل التحليل والاختبارات ثم
# يبثّ سجلاتهما في هيئة annotations (base64) لتُقرأ عبر GitHub API.
# يُحذف قبل الدمج النهائي.

on:
  pull_request:

jobs:
  report:
    name: Analyze and test report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter Sources
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          echo "exit-code: $?" >> analyze.log
          tail -c 2000 analyze.log

      - name: Run Flutter Tests
        if: always()
        continue-on-error: true
        run: |
          FILES=$(find test -name '*_test.dart' ! -name 'backup_service_benchmark_test.dart' | tr '\n' ' ')
          flutter test $FILES > tests.log 2>&1
          echo "exit-code: $?" >> tests.log
          tail -c 2000 tests.log

      - name: Publish analyze log chunks 1-9
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s analyze.log ] || exit 0
          base64 -w 0 analyze.log > analyze.b64
          split -b 900 -d -a 2 analyze.b64 analyze_b64_
          for f in $(ls analyze_b64_* 2>/dev/null | head -9); do
            printf '::error::ANALYZE-%s:%s\n' "${f##analyze_b64_}" "$(cat "$f")"
          done

      - name: Publish analyze log chunks 10-18
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s analyze.log ] || exit 0
          base64 -w 0 analyze.log > analyze.b64
          split -b 900 -d -a 2 analyze.b64 analyze_b64_
          for f in $(ls analyze_b64_* 2>/dev/null | sed -n '10,18p'); do
            printf '::error::ANALYZE-%s:%s\n' "${f##analyze_b64_}" "$(cat "$f")"
          done

      - name: Publish analyze log chunks 19-27
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s analyze.log ] || exit 0
          base64 -w 0 analyze.log > analyze.b64
          split -b 900 -d -a 2 analyze.b64 analyze_b64_
          for f in $(ls analyze_b64_* 2>/dev/null | sed -n '19,27p'); do
            printf '::error::ANALYZE-%s:%s\n' "${f##analyze_b64_}" "$(cat "$f")"
          done

      - name: Publish tests log chunks 1-9
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s tests.log ] || exit 0
          base64 -w 0 tests.log > tests.b64
          split -b 900 -d -a 2 tests.b64 tests_b64_
          for f in $(ls tests_b64_* 2>/dev/null | head -9); do
            printf '::error::TESTS-%s:%s\n' "${f##tests_b64_}" "$(cat "$f")"
          done

      - name: Publish tests log chunks 10-18
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -s tests.log ] || exit 0
          base64 -w 0 tests.log > tests.b64
          split -b 900 -d -a 2 tests.b64 tests_b64_
          for f in $(ls tests_b64_* 2>/dev/null | sed -n '10,18p'); do
            printf '::error::TESTS-%s:%s\n' "${f##tests_b64_}" "$(cat "$f")"
          done
