name: PR Diagnostics

# ملف مؤقت لأغراض التشخيص أثناء تطوير الميزة: يشغّل التحليل والاختبارات ثم
# يبثّ النتيجة في تعليق على طلب الدمج وفي annotations، لأن سجلات Actions
# لا تكون متاحة دائمًا. يُحذف قبل الدمج النهائي.

on:
  pull_request:

jobs:
  diagnostics:
    name: Analyze and test report
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter Sources
        shell: pwsh
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos 2>&1 | Tee-Object -FilePath analyze.log
          "exit-code: $LASTEXITCODE" | Add-Content -Encoding utf8 analyze.log
          $issues = Get-Content analyze.log | Where-Object { $_ -match '•' }
          Write-Host "issues: $($issues.Count)"
          $i = 0
          foreach ($line in $issues) {
            $i++
            if ($i -le 8) { Write-Host "::error::$line" }
          }

      - name: Analyze report part two
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path analyze.log) {
            $issues = Get-Content analyze.log | Where-Object { $_ -match '•' }
            $i = 0
            foreach ($line in $issues) {
              $i++
              if ($i -gt 8 -and $i -le 18) { Write-Host "::error::$line" }
            }
            if ($i -eq 0) { Write-Host "no analyzer issues" }
          }

      - name: Run Flutter Tests
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $testFiles = Get-ChildItem -Path test -Recurse -Filter '*_test.dart' |
            Where-Object { $_.Name -ne 'backup_service_benchmark_test.dart' } |
            ForEach-Object { $_.FullName }
          flutter test @testFiles 2>&1 | Tee-Object -FilePath tests.log
          "exit-code: $LASTEXITCODE" | Add-Content -Encoding utf8 tests.log

      - name: Publish report as pull request comment
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parts = @()
          foreach ($file in @('analyze.log', 'tests.log')) {
            if (Test-Path $file) {
              $parts += "### $file"
              $parts += Get-Content $file
            }
          }
          $parts -join "`n" | Out-File -Encoding utf8 diagnostics-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file diagnostics-report.md
