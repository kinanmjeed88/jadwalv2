name: Flutter Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
  push:
    branches:
      - main
      - master
      - 'release/**'

jobs:
  build:
    name: Analyze, Test, and Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter Sources
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem -Path test -Recurse -Filter '*_test.dart' |
            Where-Object { $_.Name -ne 'backup_service_benchmark_test.dart' } |
            ForEach-Object { $_.FullName }
          flutter test @testFiles

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Windows-Release
          path: build\windows\x64\runner\Release\*
          retention-days: 7
