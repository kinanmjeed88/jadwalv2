name: Verify scheduling audit (temporary)

# Temporary verification for PR #137. Runs only on the session branch:
# * format: dart format (stable) on the changed Dart files, commits the result.
# * windows: applies the branch diff (65126e2..HEAD, without .github) onto the
#   untouched tips of the Windows 7 and Windows 10/11 branches and runs each
#   branch's own toolchain: pub get, analyze, test, release build.

on:
  push:
    branches:
      - 'arena/e25ae26d-jadwalv2'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_SHA: 65126e2ea878290bcde7df06d5b6f971f2009e08
  FORMAT_CHANGED_LINES_PY: |
    """Formats only the lines changed since BASE (like git clang-format).

    New files are formatted entirely. For modified files the formatter's
    edits are kept only where they touch lines changed since BASE, so
    pre-existing unformatted code on main is left as it is.
    """
    import difflib, os, re, shutil, subprocess, sys

    base = sys.argv[1]
    fmt = os.environ.get("FMT", "dart format --language-version=3.3").split()
    check_only = os.environ.get("CHECK_ONLY") == "1"
    shell = os.name == "nt"
    for path in sys.argv[2:]:
        status, path = path.split(":", 1)
        if status == "A":
            if check_only:
                continue
            subprocess.run(fmt + [path], check=True, capture_output=True, shell=shell)
            continue
        diff = subprocess.run(["git", "diff", "-U0", base, "--", path],
                              check=True, capture_output=True, text=True).stdout
        changed = set()
        for m in re.finditer(r"^@@ -\S+ \+(\d+)(?:,(\d+))? @@", diff, re.M):
            start, count = int(m.group(1)), int(m.group(2) or 1)
            changed.update(range(start, start + count) if count else (start, start + 1))
        original = open(path, encoding="utf-8").read().splitlines(keepends=True)
        shutil.copy(path, path + ".orig-fmt")
        subprocess.run(fmt + [path], check=True, capture_output=True, shell=shell)
        formatted = open(path, encoding="utf-8").read().splitlines(keepends=True)
        shutil.move(path + ".orig-fmt", path)
        result, kept, skipped = [], 0, 0
        ops = difflib.SequenceMatcher(None, original, formatted, autojunk=False).get_opcodes()
        for tag, i1, i2, j1, j2 in ops:
            if tag == "equal":
                result.extend(original[i1:i2])
                continue
            if tag == "replace" and i2 - i1 == j2 - j1:
                for offset in range(i2 - i1):
                    if i1 + offset + 1 in changed:
                        result.append(formatted[j1 + offset]); kept += 1
                    else:
                        result.append(original[i1 + offset]); skipped += 1
                continue
            touched = set(range(i1 + 1, i2 + 1)) if i2 > i1 else {i1, i1 + 1}
            if touched & changed:
                result.extend(formatted[j1:j2]); kept += 1
            else:
                result.extend(original[i1:i2]); skipped += 1
        if not check_only:
            open(path, "w", encoding="utf-8", newline="").write("".join(result))
        print(f"{path}: kept {kept} formatter edits, left {skipped} pre-existing")

jobs:
  format:
    name: dart format (stable) + diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies (formatter needs the package language version)
        run: flutter pub get
      - name: Format changed Dart files (short style, language 3.3)
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=Formatter::$(dart --version 2>&1)"
          printf '%s\n' "$FORMAT_CHANGED_LINES_PY" > "$RUNNER_TEMP/format_changed_lines.py"
          args=()
          while IFS=$'\t' read -r status file; do
            case "$file" in *.g.dart|'') continue ;; esac
            args+=("$status:$file")
          done < <(git diff --name-status --diff-filter=AM "$BASE_SHA" HEAD -- '*.dart')
          report=$(python3 "$RUNNER_TEMP/format_changed_lines.py" "$BASE_SHA" "${args[@]}")
          echo "$report"
          echo "::notice title=Formatter edits (changed lines only)::$(echo "$report" | grep -v 'kept 0 formatter edits, left 0' | tr '\n' ' ')"
          files=("${args[@]#*:}")
          others=$(git diff --name-only | grep -vxF -f <(printf '%s\n' "${files[@]}") || true)
          if [ -n "$others" ]; then
            echo "::warning title=Modified by the CI environment (not committed)::$(echo "$others" | tr '\n' ' ')"
          fi
          if git diff --quiet -- "${files[@]}"; then
            echo "::notice title=dart format::changed lines already formatted (${#files[@]} files)"
          else
            echo "::warning title=dart format applied::$(git diff --stat -- "${files[@]}" | tail -1) :: $(git diff --name-only -- "${files[@]}" | tr '\n' ' ')"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${files[@]}"
            git commit -qm 'style: dart format changed lines (short style, language 3.3)'
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice title=dart format commit::$(git rev-parse HEAD)"
          fi
          # Remaining unformatted lines: base count on main vs current count.
          for entry in "${args[@]}"; do
            file="${entry#*:}"
            head_n=$(dart format --language-version=3.3 --output=show "$file" 2>/dev/null | diff "$file" - | grep -c '^[<>]' || true)
            if [ "${entry%%:*}" = "M" ]; then
              base_n=$(git show "$BASE_SHA:$file" | dart format --language-version=3.3 2>/dev/null | diff <(git show "$BASE_SHA:$file") - | grep -c '^[<>]' || true)
            else
              base_n=new
            fi
            if [ "$head_n" != "0" ] && [ "$head_n" != "1" ]; then
              echo "::notice title=Unformatted diff lines left in $file::now:$head_n base:$base_n"
            fi
          done
      - name: Analyzer baseline (main 65126e2 vs this branch, stable)
        shell: bash
        env:
          LABEL: main
        run: |
          set -uo pipefail
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASE_SHA"
          (cd "$RUNNER_TEMP/baseline" && flutter pub get > /dev/null)
          base_out="$RUNNER_TEMP/base_analyze.txt"; head_out="$RUNNER_TEMP/head_analyze.txt"
          (cd "$RUNNER_TEMP/baseline" && flutter analyze --no-fatal-infos > "$base_out" 2>&1) || true
          flutter analyze --no-fatal-infos > "$head_out" 2>&1 || true
          normalize() { grep -E '^\s*(info|warning|error) ' "$1" | sed -E 's/:[0-9]+:[0-9]+//; s/^\s+//' | sort; }
          normalize "$head_out" > "$RUNNER_TEMP/head.norm"
          normalize "$base_out" > "$RUNNER_TEMP/base.norm"
          new_issues=$(comm -13 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | head -15 | tr '\n' ' ')
          echo "::notice title=${LABEL} analyzer issues (base vs patched)::base=$(wc -l < "$RUNNER_TEMP/base.norm") patched=$(wc -l < "$RUNNER_TEMP/head.norm") new=$(comm -13 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | wc -l) resolved=$(comm -23 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | wc -l)"
          if [ -n "$new_issues" ]; then
            echo "::warning title=${LABEL} new analyzer issues::$new_issues"
          fi
      - name: git diff --check
        shell: bash
        run: |
          if out=$(git diff --check "$BASE_SHA" HEAD 2>&1); then
            echo "::notice title=git diff --check::clean"
          else
            echo "::error title=git diff --check::$(echo "$out" | head -20 | tr '\n' ' ')"
            exit 1
          fi

  windows:
    name: ${{ matrix.target }} (Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win7
            os: windows-2022
            flutter: '3.16.9'
            flutter_version: '3.16.9'
            branch: 'برنامج-مخصص-لوندوز-٧'
            audited_sha: a6fbb258a6bba4e5dc679d74ad1af9872c5a540a
            remove_android: 'true'
          - target: win10
            os: windows-latest
            flutter: 'stable'
            flutter_version: ''
            branch: 'برنامج-مخصص-لوندوز-١٠-و-١١'
            audited_sha: 085a499bc8b4d1e41f1a842f148ef6bb0c56bba2
            remove_android: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the change set to the Windows branch tip
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          AUDITED_SHA: ${{ matrix.audited_sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/target"
          tip=$(git rev-parse refs/remotes/origin/target)
          if [ "$tip" != "$AUDITED_SHA" ]; then
            echo "::warning title=${TARGET} tip moved::expected ${AUDITED_SHA}, found ${tip}"
          fi
          git diff --binary "$BASE_SHA" HEAD -- . ':(exclude).github' > "$(cygpath -u "$RUNNER_TEMP")/change.patch"
          target_dir="$(cygpath -u "$RUNNER_TEMP")/target"
          git worktree add --detach "$target_dir" "$tip"
          cd "$target_dir"
          git -c user.name=ci -c user.email=ci@example.invalid apply --3way --index "$(cygpath -u "$RUNNER_TEMP")/change.patch"
          files=$(git diff --cached --name-only | wc -l)
          echo "::notice title=${TARGET} patch::applied on ${tip} (source $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)); ${files} files"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter_version }}
          cache: true
      - name: Toolchain
        shell: bash
        run: echo "::notice title=${{ matrix.target }} toolchain::$(flutter --version 2>&1 | head -1) / $(dart --version 2>&1)"
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Isolate Windows-only dependency resolution
        if: matrix.remove_android == 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}/target
        run: Remove-Item -Recurse -Force android
      - name: Install Dependencies
        working-directory: ${{ runner.temp }}/target
        run: flutter pub get
      - name: dart format check of changed lines (target toolchain)
        shell: bash
        working-directory: ${{ runner.temp }}/target
        env:
          FMT: dart format
          CHECK_ONLY: '1'
        run: |
          set -uo pipefail
          args=()
          while IFS=$'\t' read -r status file; do
            case "$file" in *.g.dart|'') continue ;; esac
            args+=("$status:$file")
          done < <(git diff --cached --name-status --diff-filter=AM -- '*.dart')
          printf '%s\n' "$FORMAT_CHANGED_LINES_PY" > "$RUNNER_TEMP/format_changed_lines.py"
          report=$(python "$RUNNER_TEMP/format_changed_lines.py" HEAD "${args[@]}" 2>&1)
          echo "$report"
          new_unformatted=()
          for entry in "${args[@]}"; do
            [ "${entry%%:*}" = "A" ] || continue
            file="${entry#*:}"
            dart format --output=none --set-exit-if-changed "$file" > /dev/null 2>&1 || new_unformatted+=("$file")
          done
          echo "::notice title=${{ matrix.target }} format of changed lines::$(echo "$report" | grep -v 'kept 0 formatter edits' | tr '\n' ' ')"
          echo "::notice title=${{ matrix.target }} new files not formatted::${new_unformatted[*]:-none}"
      - name: Analyze
        shell: pwsh
        working-directory: ${{ runner.temp }}/target
        run: |
          $out = flutter analyze --no-fatal-infos 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $summary = ($out | Select-Object -Last 1)
          if ($code -ne 0) {
            $errors = ($out | Where-Object { $_ -match 'error -|warning -' } | Select-Object -First 20) -join " | "
            Write-Host "::error title=${{ matrix.target }} analyze::$errors"
            exit $code
          }
          Write-Host "::notice title=${{ matrix.target }} analyze::$summary"
      - name: Analyzer baseline (unpatched tip vs patched)
        shell: bash
        env:
          LABEL: ${{ matrix.target }}
          REMOVE_ANDROID: ${{ matrix.remove_android }}
        run: |
          set -uo pipefail
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          git worktree add --detach "$tmp/baseline" refs/remotes/origin/target
          cd "$tmp/baseline"
          if [ "$REMOVE_ANDROID" = "true" ]; then rm -rf android; fi
          flutter pub get > /dev/null
          base_out="$tmp/base_analyze.txt"; head_out="$tmp/head_analyze.txt"
          flutter analyze --no-fatal-infos > "$base_out" 2>&1 || true
          cd "$tmp/target"
          flutter analyze --no-fatal-infos > "$head_out" 2>&1 || true
          RUNNER_TEMP="$tmp"
          normalize() { grep -E '^\s*(info|warning|error) ' "$1" | sed -E 's/:[0-9]+:[0-9]+//; s/^\s+//' | sort; }
          normalize "$head_out" > "$RUNNER_TEMP/head.norm"
          normalize "$base_out" > "$RUNNER_TEMP/base.norm"
          new_issues=$(comm -13 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | head -15 | tr '\n' ' ')
          echo "::notice title=${LABEL} analyzer issues (base vs patched)::base=$(wc -l < "$RUNNER_TEMP/base.norm") patched=$(wc -l < "$RUNNER_TEMP/head.norm") new=$(comm -13 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | wc -l) resolved=$(comm -23 "$RUNNER_TEMP/base.norm" "$RUNNER_TEMP/head.norm" | wc -l)"
          if [ -n "$new_issues" ]; then
            echo "::warning title=${LABEL} new analyzer issues::$new_issues"
          fi
      - name: Test
        shell: pwsh
        working-directory: ${{ runner.temp }}/target
        run: |
          $testFiles = Get-ChildItem -Path test -Recurse -Filter '*_test.dart' |
            Where-Object { $_.Name -ne 'backup_service_benchmark_test.dart' } |
            ForEach-Object { $_.FullName }
          $out = flutter test --machine @testFiles 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $events = @($out | ForEach-Object {
            try { $_.ToString() | ConvertFrom-Json -ErrorAction Stop } catch { }
          })
          $names = @{}
          $events | Where-Object { $_.type -eq 'testStart' } | ForEach-Object { $names[$_.test.id] = $_.test.name }
          $completed = @($events | Where-Object {
            $_.type -eq 'testDone' -and -not $_.hidden -and -not $_.skipped
          })
          $passed = @($completed | Where-Object { $_.result -eq 'success' }).Count
          $failedEvents = @($completed | Where-Object { $_.result -ne 'success' })
          $skipped = @($events | Where-Object {
            $_.type -eq 'testDone' -and $_.skipped -and -not $_.hidden
          }).Count
          Write-Host ('::warning title=${{ matrix.target }} test results::Passed={0}; Failed={1}; Skipped={2}; Files={3}' -f $passed, $failedEvents.Count, $skipped, $testFiles.Count)
          if ($failedEvents.Count -gt 0) {
            $failedNames = ($failedEvents | ForEach-Object { $names[$_.testID] } | Select-Object -First 15) -join ' || '
            Write-Host "::error title=${{ matrix.target }} failed tests::$failedNames"
            $errorsText = ($events | Where-Object { $_.type -eq 'error' } | ForEach-Object { ($_.error -split "`n")[0..3] -join ' ' } | Select-Object -First 8) -join ' || '
            Write-Host "::error title=${{ matrix.target }} failure details::$errorsText"
          }
          if ($passed -eq 0) { throw 'No completed tests recorded' }
          if ($code -ne 0) { exit $code }
      - name: Build Windows Release
        working-directory: ${{ runner.temp }}/target
        shell: pwsh
        run: |
          flutter build windows --release --target=lib/main_windows.dart
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=${{ matrix.target }} build::flutter build windows failed"
            exit $LASTEXITCODE
          }
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter '*.exe' |
            Where-Object { $_.FullName -match '\\runner\\Release\\' } | Select-Object -First 1
          if ($null -eq $exe) { throw 'Release executable not found under runner/Release' }
          Write-Host "::notice title=${{ matrix.target }} build::OK $($exe.FullName) $($exe.Length) bytes"
